name: CI

# Nothing ran the test suite before this workflow existed, so a regression could
# reach main with every check green simply because there were no checks. This runs
# the backend build, vet and tests, the frontend type-check, build and tests, the compose
# guards, and the language check.
#
# CGO is disabled to match the released image: the Dockerfile builds with
# CGO_ENABLED=0. The suite needs no database — the integration tests that use one skip
# themselves unless DATABASE_URL is set.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # `npm run build` runs the type-check and the production build together.
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A compose file that fills in a default for POSTGRES_PASSWORD starts a database
      # with a password anyone can read, which is how docker-compose.prod.yml used to
      # resolve its DSN to senddock:senddock. Each production compose has to refuse to
      # interpolate without it and to interoperate once it is provided.
      - name: The production composes require POSTGRES_PASSWORD
        run: |
          set -euo pipefail
          export JWT_SECRET="$(head -c 48 /dev/urandom | base64)"
          unset POSTGRES_PASSWORD

          for file in docker-compose.prod.yml docker-compose.image.yml; do
            if docker compose -f "$file" config >/dev/null 2>&1; then
              echo "::error file=$file::$file resolved without POSTGRES_PASSWORD, so it carries a default someone can guess"
              exit 1
            fi
            POSTGRES_PASSWORD=probe docker compose -f "$file" config >/dev/null
          done

      # The same trap one step earlier: an example env whose required values are
      # placeholders boots a stack on a password published in the repository.
      - name: The example env ships no secret
        run: |
          set -euo pipefail
          for key in JWT_SECRET POSTGRES_PASSWORD; do
            line="$(grep -E "^${key}=" .env.production.example || true)"
            if [ "$line" != "${key}=" ]; then
              echo "::error file=.env.production.example::$key must ship empty, found: ${line:-nothing}"
              exit 1
            fi
          done

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repository ships in English. A file mixing two languages is unreadable in
      # review and cannot be translated later without guessing which half is current, so
      # the rule is checked rather than trusted. It also runs locally:
      #   scripts/check-language.sh
      - name: Everything tracked is in English
        run: scripts/check-language.sh
