<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="Webhook retry backoff timeline: attempts at 0s, 30s, 2m30s, 12m30s and 42m30s, with the fifth failure marking the delivery as failed">
  <style>
    .axis { stroke: #71717a; stroke-width: 1.5; }
    .tick { stroke: #52525b; stroke-width: 1.5; }
    .label { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #18181b; }
    .sub { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #71717a; }
    .delta { font: 600 10px ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.05em; fill: #52525b; }
    .dot { fill: #52525b; }
    @media (prefers-color-scheme: dark) {
      .axis { stroke: #52525b; }
      .tick { stroke: #a1a1aa; }
      .label { fill: #fafafa; }
      .sub { fill: #a1a1aa; }
      .delta { fill: #a1a1aa; }
      .dot { fill: #a1a1aa; }
    }
  </style>

  <line class="axis" x1="40" y1="100" x2="720" y2="100"/>

  <g>
    <line class="tick" x1="60" y1="92" x2="60" y2="108"/>
    <circle class="dot" cx="60" cy="100" r="5"/>
    <text class="label" x="60" y="80" text-anchor="middle">#1</text>
    <text class="sub" x="60" y="130" text-anchor="middle">0s</text>
  </g>

  <g>
    <line class="tick" x1="160" y1="92" x2="160" y2="108"/>
    <circle class="dot" cx="160" cy="100" r="5"/>
    <text class="label" x="160" y="80" text-anchor="middle">#2</text>
    <text class="sub" x="160" y="130" text-anchor="middle">30s</text>
  </g>
  <text class="delta" x="110" y="158" text-anchor="middle">+30s</text>

  <g>
    <line class="tick" x1="290" y1="92" x2="290" y2="108"/>
    <circle class="dot" cx="290" cy="100" r="5"/>
    <text class="label" x="290" y="80" text-anchor="middle">#3</text>
    <text class="sub" x="290" y="130" text-anchor="middle">2m 30s</text>
  </g>
  <text class="delta" x="225" y="158" text-anchor="middle">+2m</text>

  <g>
    <line class="tick" x1="450" y1="92" x2="450" y2="108"/>
    <circle class="dot" cx="450" cy="100" r="5"/>
    <text class="label" x="450" y="80" text-anchor="middle">#4</text>
    <text class="sub" x="450" y="130" text-anchor="middle">12m 30s</text>
  </g>
  <text class="delta" x="370" y="158" text-anchor="middle">+10m</text>

  <g>
    <line class="tick" x1="640" y1="92" x2="640" y2="108"/>
    <circle class="dot" cx="640" cy="100" r="5"/>
    <text class="label" x="640" y="80" text-anchor="middle">#5</text>
    <text class="sub" x="640" y="130" text-anchor="middle">42m 30s</text>
  </g>
  <text class="delta" x="545" y="158" text-anchor="middle">+30m</text>

  <g>
    <line x1="710" y1="92" x2="710" y2="108" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="710" cy="100" r="5" fill="#ef4444"/>
    <text x="710" y="80" text-anchor="middle" fill="#ef4444" font-family="ui-sans-serif, system-ui" font-size="11" font-weight="600" letter-spacing="0.05em">FAIL</text>
    <text x="710" y="130" text-anchor="middle" fill="#ef4444" font-family="ui-sans-serif, system-ui" font-size="11">~2h 12m</text>
  </g>
  <text class="delta" x="675" y="158" text-anchor="middle" fill="#f59e0b">+2h</text>

  <text class="sub" x="380" y="190" text-anchor="middle">5 attempts max — terminal &quot;failed&quot; if all return non-2xx</text>
</svg>
