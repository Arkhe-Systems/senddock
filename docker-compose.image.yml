services:
  senddock:
    image: ghcr.io/arkhe-systems/senddock:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://senddock:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/senddock?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      PORT: 8080
      PUBLIC_URL: ${PUBLIC_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      SENDDOCK_LICENSE_KEY: ${SENDDOCK_LICENSE_KEY:-}
      SENDDOCK_LICENSE_ENDPOINT: ${SENDDOCK_LICENSE_ENDPOINT:-}
      SENDDOCK_WATCHTOWER_URL: ${SENDDOCK_WATCHTOWER_URL:-}
      SENDDOCK_WATCHTOWER_TOKEN: ${SENDDOCK_WATCHTOWER_TOKEN:-}
    ports:
      - "${SENDDOCK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: senddock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: senddock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senddock"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
